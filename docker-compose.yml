name: turismo-sv

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: turismo
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
    ports:
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/20-test-database.sql:/docker-entrypoint-initdb.d/20-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U turismo -d turismo"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: amazon/aws-cli:2.37.9
    profiles: ["init"]
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: turismo
      AWS_SECRET_ACCESS_KEY: turismo-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        (aws --endpoint-url http://s3:8333 s3api head-bucket --bucket turismo || aws --endpoint-url http://s3:8333 s3 mb s3://turismo)
        && aws --endpoint-url http://s3:8333 s3api put-bucket-cors --bucket turismo --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":3600}]}'

  php:
    build: docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      BUILDER_URL: http://builder:3100
      BUILDER_TOKEN: ${BUILDER_TOKEN:-dev-builder-token-change-me-123456}
      BUILDER_CALLBACK_BASE: http://php:8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/repo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  queue:
    build: docker/php
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    restart: unless-stopped
    volumes:
      - ./:/repo
    depends_on:
      php:
        condition: service_healthy

  scheduler:
    build: docker/php
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./:/repo
    depends_on:
      php:
        condition: service_healthy

  builder:
    build: docker/builder
    environment:
      BUILDER_TOKEN: ${BUILDER_TOKEN:-dev-builder-token-change-me-123456}
      CALLBACK_HOSTS: php
      REFERENCE_HOSTS: localhost
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "3100"
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3100:3100"
    volumes:
      - ./:/repo
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  postgres-data:
  s3-data:
